name: AI Audio UI Build & Deploy

on:
  push:
    branches: [master]
    # 纯文档改动跳过整条 build+deploy(仅这些文件时不触发)。
    # 文档+代码混合的 push 仍照常部署；需强制部署走下方 workflow_dispatch。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-audio-ui-build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAME: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/seanfield/ai-audio-assistant-ui

jobs:
  publish:
    name: Publish master image on Windows runner
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    environment:
      name: dev
      deployment: false
    outputs:
      started_at: ${{ steps.pipeline_start.outputs.started_at }}
      runner_name: ${{ steps.pipeline_start.outputs.runner_name }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_AUTH_URL: ${{ vars.NEXT_PUBLIC_AUTH_URL }}
      NEXT_PUBLIC_AUTH_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH_CLIENT_ID }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: Record pipeline start
        id: pipeline_start
        run: |
          for /f %%i in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()"') do echo started_at=%%i>>%GITHUB_OUTPUT%
          echo runner_name=${{ runner.name }}>>%GITHUB_OUTPUT%

      - name: Push CI/CD active metric
        continue-on-error: true
        timeout-minutes: 1
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          PUSHGW_AUTH: ${{ secrets.PUSHGW_BASIC_AUTH }}
        run: |
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $metrics = @"
          # HELP cicd_pipeline_active Whether a CI/CD pipeline is currently active (1=true, 0=false).
          # TYPE cicd_pipeline_active gauge
          cicd_pipeline_active{project="ai-audio-assistant-ui",branch="master",environment="dev",runner="${{ runner.name }}"} 1
          # HELP cicd_pipeline_active_timestamp_seconds Timestamp of the latest CI/CD active-state update.
          # TYPE cicd_pipeline_active_timestamp_seconds gauge
          cicd_pipeline_active_timestamp_seconds{project="ai-audio-assistant-ui",branch="master",environment="dev",runner="${{ runner.name }}"} $now
          "@
          $body = (($metrics -replace "`r`n", "`n").Trim() + "`n")
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://192.168.1.11:9094/metrics/job/cicd_active/project_key/ai-audio-assistant-ui/branch_key/master/environment_key/dev" -ContentType "text/plain; version=0.0.4" -Headers @{ Authorization = "Basic $env:PUSHGW_AUTH" } -Body $bytes -TimeoutSec 5

      - name: Isolate Docker credentials
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $dockerConfig = Join-Path $env:RUNNER_TEMP ".docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          if (Test-Path -LiteralPath $dockerConfig) {
            Remove-Item -LiteralPath $dockerConfig -Recurse -Force
          }
          New-Item -ItemType Directory -Path $dockerConfig | Out-Null
          "DOCKER_CONFIG=$dockerConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Verify Docker access
        run: |
          docker version
          docker ps

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --cache "%RUNNER_TEMP%\npm-cache"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build --build-arg NEXT_PUBLIC_APP_URL="%NEXT_PUBLIC_APP_URL%" --build-arg NEXT_PUBLIC_API_BASE_URL="%NEXT_PUBLIC_API_BASE_URL%" --build-arg NEXT_PUBLIC_API_URL="%NEXT_PUBLIC_API_URL%" --build-arg NEXT_PUBLIC_AUTH_URL="%NEXT_PUBLIC_AUTH_URL%" --build-arg NEXT_PUBLIC_AUTH_CLIENT_ID="%NEXT_PUBLIC_AUTH_CLIENT_ID%" --build-arg NEXT_PUBLIC_BUILD_SHA=%GITHUB_SHA% -t "%IMAGE_NAME%:%GITHUB_SHA%" .

      - name: Login to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          logout: false

      - name: Push Docker image
        run: docker push "%IMAGE_NAME%:%GITHUB_SHA%"

      - name: Cleanup local Docker artifacts
        if: always()
        run: |
          docker image rm "%IMAGE_NAME%:%GITHUB_SHA%" 2>NUL
          docker builder prune --filter "until=72h" -f

      - name: Cleanup Docker credentials
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $expected = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP ".docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"))
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if ([string]::IsNullOrWhiteSpace($env:DOCKER_CONFIG) -or [System.IO.Path]::GetFullPath($env:DOCKER_CONFIG) -ne $expected) {
            throw "拒绝清理非本 job 的 DOCKER_CONFIG: $env:DOCKER_CONFIG"
          }
          $configPath = [System.IO.Path]::GetFullPath($env:DOCKER_CONFIG)
          if (-not $configPath.StartsWith($runnerTemp + [System.IO.Path]::DirectorySeparatorChar)) {
            throw "DOCKER_CONFIG 不在 RUNNER_TEMP 下: $configPath"
          }
          if (Test-Path -LiteralPath $configPath) {
            Remove-Item -LiteralPath $configPath -Recurse -Force
          }

  deploy:
    name: Deploy master on dev server
    if: github.ref == 'refs/heads/master'
    needs: publish
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    environment: dev
    outputs:
      started_at: ${{ steps.deploy_start.outputs.started_at }}

    steps:
      - name: Record deploy start time
        id: deploy_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Isolate Docker credentials
        run: |
          docker_config="${RUNNER_TEMP}/.docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if [ -e "$docker_config" ]; then
            echo "DOCKER_CONFIG 路径已存在，拒绝复用: $docker_config"
            exit 1
          fi
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Login to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          logout: false

      - name: Pull and restart ai-audio-assistant-ui
        run: |
          cd ~/project/ai-audio-assistant-ui
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cat > docker-compose.ai-audio-ui-ghcr.yml <<'EOF'
          services:
            ai-audio-assistant-ui:
              image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
              container_name: ai-audio-assistant-ui
              restart: always
              environment:
                - NODE_ENV=production
              deploy:
                resources:
                  limits:
                    memory: 128m
              networks:
                - ai-audio-network

          networks:
            ai-audio-network:
              external: true
          EOF
          docker rm -f ai-audio-assistant-ui-frontend-1 2>/dev/null || true
          docker rm -f ai-audio-assistant-ui 2>/dev/null || true
          docker compose -f docker-compose.ai-audio-ui-ghcr.yml up -d

      - name: Verify deployed image and version
        run: |
          expected_image="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          actual_image="$(docker inspect --format '{{.Config.Image}}' ai-audio-assistant-ui)"
          if [ "$actual_image" != "$expected_image" ]; then
            echo "镜像身份不一致: expected=$expected_image actual=$actual_image"
            docker logs --tail=120 ai-audio-assistant-ui || true
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if docker exec ai-audio-assistant-ui node -e 'fetch("http://127.0.0.1:3000/version").then(async response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); const payload = await response.json(); if (payload.version !== process.argv[1]) throw new Error(`version mismatch: expected=${process.argv[1]} actual=${payload.version}`) })' "$GITHUB_SHA"; then
              exit 0
            fi
            sleep 2
          done

          echo "版本探活失败，最后一次响应:"
          docker exec ai-audio-assistant-ui node -e 'fetch("http://127.0.0.1:3000/version").then(response => response.text()).then(console.log)' || true
          docker logs --tail=120 ai-audio-assistant-ui || true
          exit 1

      - name: Cleanup old images
        if: always()
        run: |
          current="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' ${{ env.IMAGE_NAME }} \
            | awk -v current="$current" '$1 != current {print $2}' \
            | sort -u \
            | xargs -r docker rmi || true

      - name: Cleanup Docker credentials
        if: always()
        run: |
          expected="${RUNNER_TEMP}/.docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if [ -z "${DOCKER_CONFIG:-}" ] || [ "$DOCKER_CONFIG" != "$expected" ]; then
            echo "拒绝清理非本 job 的 DOCKER_CONFIG: ${DOCKER_CONFIG:-<empty>}"
            exit 1
          fi
          case "$DOCKER_CONFIG" in
            "$RUNNER_TEMP"/.docker-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT"-"$GITHUB_JOB") ;;
            *)
              echo "DOCKER_CONFIG 不在 RUNNER_TEMP 的 job 隔离路径下: $DOCKER_CONFIG"
              exit 1
              ;;
          esac
          rm -rf -- "$DOCKER_CONFIG"

  finalize:
    name: Finalize master release
    needs: [publish, deploy]
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    environment:
      name: dev
      deployment: false

    steps:
      - name: Resolve final release status
        id: final_status
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PUBLISH_STARTED_AT: ${{ needs.publish.outputs.started_at }}
          DEPLOY_STARTED_AT: ${{ needs.deploy.outputs.started_at }}
          PUBLISH_RUNNER_NAME: ${{ needs.publish.outputs.runner_name }}
        run: |
          if [ "$PUBLISH_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            final_status=success
          else
            final_status=failure
          fi

          pipeline_started_at="${PUBLISH_STARTED_AT:-$(date +%s)}"
          deploy_started_at="${DEPLOY_STARTED_AT:-$pipeline_started_at}"
          runner_name="${PUBLISH_RUNNER_NAME:-unknown}"
          {
            echo "status=$final_status"
            echo "pipeline_started_at=$pipeline_started_at"
            echo "deploy_started_at=$deploy_started_at"
            echo "runner_name=$runner_name"
          } >> "$GITHUB_OUTPUT"
          echo "发布最终状态: publish=$PUBLISH_RESULT deploy=$DEPLOY_RESULT final=$final_status"

      - name: Push CI/CD metrics
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          bash ~/scripts/push-cicd-metrics.sh \
            ai-audio-assistant-ui \
            "${{ github.ref_name }}" \
            dev \
            "${{ steps.final_status.outputs.status }}" \
            "${{ steps.final_status.outputs.pipeline_started_at }}" \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            "${{ github.sha }}" \
            "${{ steps.final_status.outputs.runner_name }}" \
            ai-audio-assistant-ui \
            "${{ steps.final_status.outputs.deploy_started_at }}"


      - name: Fail unsuccessful release
        if: ${{ always() && steps.final_status.outputs.status != 'success' }}
        run: exit 1
